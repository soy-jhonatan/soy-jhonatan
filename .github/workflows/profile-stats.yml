name: Actualizar estadísticas del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - README.md
      - scripts/update_profile.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'soy-jhonatan/soy-jhonatan' && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener el repositorio del perfil
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Contar commits y generar tarjetas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.PROFILE_STATS_TOKEN != '' }}
          EXTRA_REPOSITORIES: ${{ vars.PROFILE_EXTRA_REPOSITORIES }}
        run: python3 scripts/update_profile.py

      - name: Guardar las tarjetas actualizadas
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: actualizar estadísticas del perfil'
          git pull --rebase origin "$PROFILE_BRANCH"
          git push origin "HEAD:$PROFILE_BRANCH"
